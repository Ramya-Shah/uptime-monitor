# Sites the monitor checks. interval and timeout are Go durations ("30s", "1m").
# Defaults: interval 30s, timeout 10s.
sites:
  - name: snap-to-pay
    url: https://snap-to-pay.vercel.app
    interval: 30s
  - name: codepulse
    url: https://codepulse-app.duckdns.org/health
    interval: 30s
    timeout: 15s # e2-micro backend; first probe took ~5 s
  - name: oauth-ready
    url: https://oauth-ready-ten.vercel.app
    interval: 60s
  - name: taskforge
    url: https://taskforge.136.80.52.40.sslip.io/healthz
    interval: 30s
