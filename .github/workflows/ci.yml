name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you run "verify-live" by hand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the integration tests. The password only exists
    # inside this job's container, so it is not a real secret.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uptime
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: uptime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uptime"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://uptime:ci-only@localhost:5432/uptime?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2024.1.1 ./...
      - name: test (race detector, real Postgres)
        run: go test -race -count=1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: uptime-monitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test (the image starts and prints usage)
        run: docker run --rm uptime-monitor:ci verify || [ $? -eq 2 ]

  # Manual only: runs verify from a GitHub runner against the live TaskForge
  # health check. Kept out of push/PR builds so a slow external site can't
  # break CI for code changes.
  verify-live:
    if: github.event_name == 'workflow_dispatch'
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/uptime-monitor verify --url https://taskforge.136.80.52.40.sslip.io/healthz --checks 10 --interval 3s --max-p95 800ms
